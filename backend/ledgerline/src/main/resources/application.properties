spring.application.name=ledgerline
spring.profiles.active=dev
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
spring.datasource.username=${DB_USER:ledgerline_user}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-stacktrace=never
ledgerline.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-any-real-use-32b}
ledgerline.jwt.ttl-minutes=30
ledgerline.cors.origin=http://localhost:5173
